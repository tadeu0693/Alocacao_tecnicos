<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Central de Alocação</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#12151b; --panel:#191d25; --panel-alt:#20252f;
    --border:#2b313d; --border-soft:#242a34;
    --text:#e9edf3; --text-dim:#8b93a3; --text-faint:#5c6474;
    --blue:#4c8dff; --blue-dim:#1f3a63;
    --teal:#3fc2a0; --teal-dim:#1a4238;
    --amber:#f0a93a; --amber-dim:#4a3517;
    --red:#ef5b52; --red-dim:#4a2320;
    --weekend:#1c212b; --today:#f0a93a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text); min-height:100%;}
  body{font-family:'Inter',system-ui,sans-serif; font-size:13.5px; -webkit-font-smoothing:antialiased;}
  .app{background:var(--bg); border:1px solid var(--border); border-radius:16px; overflow:hidden; min-height:600px;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}

  /* auth screens */
  .gate{min-height:600px; display:flex; align-items:center; justify-content:center; padding:30px;}
  .gate-card{max-width:400px; width:100%;}
  .gate-card .eyebrow{justify-content:flex-start; display:flex;}
  .gate-card h1{text-align:left;}
  .auth-field{margin-bottom:12px;}
  .auth-field label{display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px; font-weight:500;}
  .auth-field input{width:100%; padding:10px 12px;}
  .error-box{background:var(--red-dim); border:1px solid rgba(239,91,82,.4); color:#ffb4ae; border-radius:8px; padding:9px 11px; font-size:12px; margin-bottom:12px;}
  .info-box{background:var(--blue-dim); border:1px solid rgba(76,141,255,.4); color:#bcd4ff; border-radius:8px; padding:9px 11px; font-size:11.5px; margin-bottom:14px;}

  /* topbar */
  .topbar{padding:18px 24px 14px 24px; border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,var(--panel-alt),var(--panel));
    display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; justify-content:space-between;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); margin:0 0 6px 0; font-weight:500;}
  h1{font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:700; margin:0; letter-spacing:-.01em;}
  h2{font-family:'Space Grotesk',sans-serif; font-size:16px; margin:0;}
  .sub{color:var(--text-dim); font-size:12.5px; margin-top:4px;}
  .topbar-right{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  input[type=text], input[type=email], input[type=password], select, input[type=date]{
    background:var(--panel-alt); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:8px 10px; font-size:12.5px; font-family:'Inter',sans-serif; outline:none;}
  input:focus, select:focus{border-color:var(--blue);}
  .btn{background:var(--blue); color:#fff; border:none; border-radius:8px; padding:9px 14px;
    font-size:12.5px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; display:inline-flex; align-items:center; gap:6px;}
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn.ghost:hover{border-color:var(--text-dim);}
  .btn.danger{background:var(--red);}
  .btn.small{padding:6px 10px; font-size:11.5px;}
  .btn.wide{width:100%; justify-content:center;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  .who{display:flex; align-items:center; gap:8px;}
  .who .email{font-size:12px; color:var(--text-dim);}
  .badge-papel{font-size:9.5px; font-family:'IBM Plex Mono',monospace; padding:3px 7px; border-radius:5px; background:var(--panel-alt); border:1px solid var(--border); color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em;}
  .badge-papel.admin{color:var(--amber); border-color:var(--amber-dim);}
  .badge-papel.editor{color:var(--blue); border-color:var(--blue-dim);}
  .badge-papel.tecnico{color:var(--teal); border-color:var(--teal-dim);}

  .tabs{display:flex; gap:4px; padding:0 24px; border-bottom:1px solid var(--border); background:var(--panel); flex-wrap:wrap;}
  .tab{padding:11px 14px; font-size:12.5px; color:var(--text-dim); cursor:pointer; border-bottom:2px solid transparent; font-weight:600;}
  .tab.active{color:var(--text); border-color:var(--blue);}

  .stats{display:flex; gap:8px; padding:14px 24px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .pill{display:flex; align-items:center; gap:8px; padding:7px 12px; border-radius:999px; background:var(--panel-alt);
    border:1px solid var(--border); font-size:12px; color:var(--text-dim); cursor:pointer; user-select:none;}
  .pill.active{border-color:var(--blue); color:var(--text);}
  .dot{width:8px; height:8px; border-radius:50%;}
  .pill b{color:var(--text); font-weight:600;}

  .body{display:flex; min-height:480px;}
  .sidebar{width:260px; flex-shrink:0; border-right:1px solid var(--border); background:var(--panel); overflow-y:auto; max-height:600px;}
  .sidebar-head{padding:12px 14px 8px 14px;}
  .tech-row{padding:10px 14px; border-bottom:1px solid var(--border-soft); cursor:pointer; display:flex; flex-direction:column; gap:4px;}
  .tech-row:hover{background:var(--panel-alt);}
  .tech-row.selected{background:var(--blue-dim); border-left:3px solid var(--blue); padding-left:11px;}
  .tech-name{font-weight:600; font-size:12.5px;}
  .tech-meta{color:var(--text-faint); font-size:11px;}
  .status-badge{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-family:'IBM Plex Mono',monospace;
    width:fit-content; padding:2px 7px; border-radius:5px; margin-top:2px;}
  .status-livre{background:var(--teal-dim); color:var(--teal);}
  .status-campo{background:var(--blue-dim); color:var(--blue);}
  .status-indisp{background:var(--red-dim); color:var(--red);}

  .timeline-wrap{flex:1; overflow-x:auto; overflow-y:auto; max-height:600px;}
  .nav-row{display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--panel); z-index:5;}
  .nav-row .period{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-dim);}
  .grid-header{display:flex; position:sticky; top:41px; background:var(--panel); z-index:4; border-bottom:1px solid var(--border);}
  .day-col{flex-shrink:0; text-align:center; padding:8px 0 6px 0; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-faint); border-right:1px solid var(--border-soft);}
  .day-col .dow{display:block; text-transform:uppercase; letter-spacing:.05em;}
  .day-col .num{display:block; color:var(--text-dim); font-size:12px; margin-top:2px;}
  .day-col.weekend{background:var(--weekend);}
  .day-col.today{background:rgba(240,169,58,.10);}
  .day-col.today .num{color:var(--today); font-weight:700;}

  .rows{position:relative;}
  .track{position:relative; border-bottom:1px solid var(--border-soft); display:flex;}
  .row-label{position:sticky; left:0; z-index:3; flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--border); display:flex; flex-direction:column; justify-content:center;
    padding:6px 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row-label .n{font-weight:700; font-size:11.5px; overflow:hidden; text-overflow:ellipsis;}
  .row-label .l{color:var(--text-faint); font-size:10px; overflow:hidden; text-overflow:ellipsis;}
  .row-label-corner{position:sticky; left:0; top:0; z-index:6; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border); border-bottom:1px solid var(--border);}
  .days-area{position:relative; flex-shrink:0;}
  .track-bg{position:absolute; inset:0; display:flex;}
  .bgcell{flex-shrink:0; border-right:1px solid var(--border-soft);}
  .bgcell.weekend{background:var(--weekend);}
  .bgcell.today{background:rgba(240,169,58,.07);}
  .lanes{position:relative; width:100%;}

  .bar{position:absolute; top:4px; height:24px; border-radius:6px; font-size:11px; color:#0d0f13; display:flex; align-items:center;
    padding:0 8px; overflow:hidden; white-space:nowrap; cursor:pointer; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.35);}
  .bar.tipo-Implantação{background:var(--blue); color:#08101f;}
  .bar.tipo-Manutenção{background:var(--teal); color:#06201a;}
  .bar.tipo-Outro{background:var(--amber); color:#241a05;}
  .bar.tipo-Indisponibilidade{background:var(--red); color:#230807; opacity:.9;}
  .bar.emergencia{outline:2px solid #ff2d55; outline-offset:-2px;}
  .bar.conflito{outline:2px solid #fff; outline-offset:-2px;
    background-image:repeating-linear-gradient(135deg, rgba(0,0,0,.18) 0 6px, transparent 6px 12px);}
  .bar .conflict-flag{margin-left:auto; font-size:11px;}

  .empty{padding:50px 20px; text-align:center; color:var(--text-dim);}

  .overlay{position:fixed; inset:0; background:rgba(8,10,14,.6); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal{background:var(--panel); border:1px solid var(--border); border-radius:14px; width:100%; max-width:460px; padding:22px; max-height:90vh; overflow-y:auto;}
  .modal .sub{margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px; font-weight:500;}
  .field input, .field select, .field textarea{width:100%;}
  .field textarea{resize:vertical; min-height:50px; font-family:'Inter',sans-serif;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .checkbox-field{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .checkbox-field input{width:auto;}
  .checkbox-field label{margin-bottom:0; color:var(--text); font-size:12.5px;}
  .warn-box{background:var(--red-dim); border:1px solid rgba(239,91,82,.4); color:#ffb4ae; border-radius:8px; padding:9px 11px; font-size:12px; margin-bottom:12px; display:flex; gap:8px; align-items:flex-start;}
  .emerg-box{background:var(--red-dim); border:1px solid rgba(255,45,85,.5); border-radius:8px; padding:10px 12px; margin-bottom:12px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px;}
  .detail-list{font-size:12.5px; line-height:1.9; color:var(--text-dim);}
  .detail-list b{color:var(--text); font-weight:600;}
  .emerg-badge{font-size:9.5px; font-family:'IBM Plex Mono',monospace; padding:2px 6px; border-radius:5px; background:var(--red-dim); color:#ffb4ae; text-transform:uppercase; letter-spacing:.03em; margin-left:6px;}

  .legend{display:flex; gap:14px; padding:10px 24px; border-top:1px solid var(--border); flex-wrap:wrap; color:var(--text-dim); font-size:11.5px;}
  .legend-item{display:flex; align-items:center; gap:6px;}
  .legend-sw{width:10px; height:10px; border-radius:3px;}

  .manage-wrap{padding:20px 24px; max-height:600px; overflow-y:auto;}
  .manage-form{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; align-items:flex-end; background:var(--panel-alt); border:1px solid var(--border); border-radius:10px; padding:14px;}
  .manage-form .field{margin-bottom:0; min-width:150px; flex:1;}
  .manage-list{display:flex; flex-direction:column; gap:8px;}
  .manage-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; background:var(--panel-alt); border:1px solid var(--border); border-radius:10px; flex-wrap:wrap;}
  .manage-item .info b{display:block; font-size:13px;}
  .manage-item .info span{display:block; color:var(--text-dim); font-size:11.5px;}
  .manage-actions{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}

  .tech-view{padding:22px 24px;}
  .cards{display:flex; flex-direction:column; gap:12px;}
  .section-title{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); margin:18px 0 10px 0;}
  .card{background:var(--panel-alt); border:1px solid var(--border); border-radius:12px; padding:14px 16px;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .card-title{font-weight:700; font-size:14px;}
  .card-sub{color:var(--text-dim); font-size:12px; margin-top:2px;}
  .tipo-tag{font-size:10.5px; font-family:'IBM Plex Mono',monospace; padding:3px 8px; border-radius:5px; white-space:nowrap;}
  .tag-Implantação{background:var(--blue-dim); color:var(--blue);}
  .tag-Manutenção{background:var(--teal-dim); color:var(--teal);}
  .tag-Outro{background:var(--amber-dim); color:var(--amber);}
  .tag-Indisponibilidade{background:var(--red-dim); color:var(--red);}
  .colegas{margin-top:10px; padding-top:10px; border-top:1px solid var(--border-soft); font-size:12px; color:var(--text-dim);}
  .colegas b{color:var(--text);}

  .report-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:20px;}
  .report-card{background:var(--panel-alt); border:1px solid var(--border); border-radius:10px; padding:14px;}
  .report-card .num{font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:700;}
  .report-card .lbl{color:var(--text-dim); font-size:11px; margin-top:2px;}
  table.report-table{width:100%; border-collapse:collapse; font-size:12px;}
  table.report-table th{text-align:left; color:var(--text-faint); font-size:10px; text-transform:uppercase; letter-spacing:.05em; padding:8px 10px; border-bottom:1px solid var(--border); font-family:'IBM Plex Mono',monospace;}
  table.report-table td{padding:9px 10px; border-bottom:1px solid var(--border-soft);}
  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:10px;}

  ::-webkit-scrollbar{height:10px; width:10px;}
  ::-webkit-scrollbar-track{background:var(--panel);}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}

  /* ================= responsivo (celular / tela estreita) ================= */
  @media (max-width: 720px){
    body{font-size:13px;}
    .app{border-radius:12px; min-height:0;}
    .topbar{padding:14px 14px 12px 14px; flex-direction:column; align-items:stretch;}
    .topbar-right{width:100%; flex-direction:column; align-items:stretch;}
    .topbar-right > *{width:100%;}
    .who{justify-content:space-between;}
    h1{font-size:18px;}
    .tabs{padding:0 10px; overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch;}
    .tab{padding:10px 10px; white-space:nowrap; flex-shrink:0;}
    .stats{padding:10px 14px; gap:6px;}
    .pill{padding:6px 9px; font-size:11px;}

    .body{flex-direction:column; min-height:0;}
    .sidebar{width:100%; max-height:180px; border-right:none; border-bottom:1px solid var(--border);}
    .timeline-wrap{max-height:none;}
    .grid-header{top:0;}
    .nav-row{position:sticky; top:0;}

    .manage-wrap, .tech-view{padding:14px;}
    .manage-form{flex-direction:column; align-items:stretch; gap:10px;}
    .manage-form .field{width:100%; min-width:0;}
    .manage-item{flex-direction:column; align-items:stretch;}
    .manage-actions{justify-content:flex-start;}

    .row2{flex-direction:column; gap:0;}
    .overlay{padding:10px; align-items:flex-end;}
    .modal{max-width:100%; border-radius:14px 14px 0 0; max-height:85vh;}

    .report-grid{grid-template-columns:repeat(2,1fr);}
    table.report-table{font-size:11px;}
    table.report-table th, table.report-table td{padding:7px 8px;}

    .gate{padding:16px; min-height:0;}
    .gate-card{max-width:100%;}
  }
</style>
</head>
<body><div class="app" id="app"></div>
<script>
(function(){

  const DOW = ["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
  const TIPOS = ["Implantação","Manutenção","Indisponibilidade","Outro"];
  const PAPEIS = [
    {id:"admin", label:"Administrador"},
    {id:"editor", label:"Equipe (acesso completo)"},
    {id:"planejador", label:"Planejador (cadastra projetos)"},
    {id:"supervisor", label:"Supervisor (aloca técnicos)"},
    {id:"tecnico", label:"Técnico de campo"}
  ];

  let TECNICOS=[], PROJETOS=[], allocations=[], USERS=[];
  let currentUser = null;
  let offlineMode = false;
  let loaded = false;
  let hasUsers = null; // null = ainda não sabemos

  let windowStart = startOfDay(new Date());
  let selectedTech = null, filterText = "", filterTipo = "Todos", onlyConflicts = false;
  let modal = null, confirmDelete = null;
  let activeTab = "quadro";

  let authMode = "login"; // 'login' | 'setup'
  let loginEmail = "", loginSenha = "", loginError = "", loginBusy=false;
  let setupEmail = "", setupSenha = "", setupSenha2 = "", setupError = "", setupBusy=false;
  let usuarioErro = "";

  let reportMode = "semana";
  let reportDate = startOfDay(new Date());

  /* ================= api ================= */
  let TOKEN = null;
  try{ TOKEN = localStorage.getItem('cav_token'); }catch(e){}

  async function api(path, opts){
    opts = opts || {};
    const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
    if(TOKEN) headers['Authorization'] = 'Bearer '+TOKEN;
    let res;
    try{
      res = await fetch(path, Object.assign({}, opts, {headers}));
    }catch(networkErr){
      throw {status:0, error:'Não foi possível falar com o servidor. Verifique sua conexão.'};
    }
    let data = null;
    try{ data = await res.json(); }catch(e){}
    if(!res.ok){
      throw {status:res.status, error: (data&&data.error) || ('Erro '+res.status)};
    }
    return data;
  }
  function setToken(t){
    TOKEN = t;
    try{ if(t) localStorage.setItem('cav_token', t); else localStorage.removeItem('cav_token'); }catch(e){}
  }

  /* ================= date helpers ================= */
  function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
  function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function addMonths(d,n){ const x=new Date(d); x.setMonth(x.getMonth()+n); return x; }
  function toISO(d){ return d.toISOString().slice(0,10); }
  function fromISO(s){ const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); }
  function diffDays(a,b){ return Math.round((startOfDay(a)-startOfDay(b))/86400000); }
  function fmtShort(d){ return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); }
  function fmtLong(d){ return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
  function overlaps(aS,aE,bS,bE){ return aS<=bE && bS<=aE; }
  function timesOverlap(aIni,aFim,bIni,bFim){ return aIni < bFim && bIni < aFim; }
  // Rótulo da barra: só inclui o local se a barra for larga o suficiente para não cortar o texto no meio.
  // Sempre retorna o texto completo separadamente para uso em title (tooltip).
  function barLabel(a, widthPx){
    const full = (a.obra||a.tipo)+(a.local?(' · '+a.local):'');
    const base = a.obra||a.tipo;
    if(!a.local) return {short: base, full};
    // ~6.2px por caractere é uma estimativa razoável para a fonte de 11px usada nas barras
    const fits = widthPx >= (full.length*6.2 + 16);
    return {short: fits ? full : base, full};
  }
  // Divide o período visível da alocação em trechos, pulando sábado/domingo — assim a barra
  // não aparenta "trabalho" no fim de semana quando na verdade é só o intervalo entre dias úteis.
  // Exceção: se o trecho visível inteiro cair só em fim de semana, mostra normalmente (trabalho de FDS de fato).
  function weekdaySegments(inicio, fim, windowStart, daysInView){
    const s = new Date(Math.max(fromISO(inicio), windowStart));
    const e = new Date(Math.min(fromISO(fim), addDays(windowStart, daysInView-1)));
    if(s>e) return [];
    const segments = [];
    let curStart = null, cursor = s;
    while(cursor <= e){
      const isWeekend = cursor.getDay()===0 || cursor.getDay()===6;
      if(!isWeekend){
        if(curStart===null) curStart = cursor;
      } else if(curStart!==null){
        segments.push([curStart, addDays(cursor,-1)]); curStart=null;
      }
      cursor = addDays(cursor,1);
    }
    if(curStart!==null) segments.push([curStart, e]);
    if(segments.length===0) segments.push([s,e]);
    return segments;
  }
  // Duas alocações só conflitam por horário quando ambas são no mesmo dia único
  // e ambas têm horário definido; nesse caso, só é conflito se os horários se cruzarem.
  // Caso contrário (dia inteiro, ou período de vários dias), vale a checagem por data.
  function allocConflicts(a, b){
    if(!overlaps(fromISO(a.inicio),fromISO(a.fim),fromISO(b.inicio),fromISO(b.fim))) return false;
    if(a.inicio===a.fim && b.inicio===b.fim && a.inicio===b.inicio && a.horaInicio && a.horaFim && b.horaInicio && b.horaFim){
      return timesOverlap(a.horaInicio, a.horaFim, b.horaInicio, b.horaFim);
    }
    return true;
  }
  function startOfWeekMon(d){ const x=startOfDay(d); const wd=(x.getDay()+6)%7; return addDays(x,-wd); }
  function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
  function endOfMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0); }
  function monthLabel(d){ return d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); }
  function overlapDaysInPeriod(a, pStart, pEnd){
    const s = fromISO(a.inicio) < pStart ? pStart : fromISO(a.inicio);
    const e = fromISO(a.fim) > pEnd ? pEnd : fromISO(a.fim);
    if(s>e) return 0;
    return diffDays(e,s)+1;
  }
  function isMobile(){ return (root() ? root().clientWidth : window.innerWidth) < 640; }
  function viewConfig(){
    const w = root() ? root().clientWidth : window.innerWidth;
    if(w < 640){
      const days = w < 420 ? 5 : 7;
      const dayWidth = Math.max(40, Math.floor((w - 8) / days));
      return {days, dayWidth};
    }
    return {days:14, dayWidth:64};
  }
  function navStepDays(){ return isMobile() ? viewConfig().days : 7; }

  function tecById(id){ return TECNICOS.find(t=>t.id===id) || {id, nome:"(técnico removido)", cargo:"", local:"", tipo:""}; }
  function projById(id){ return PROJETOS.find(p=>p.id===id); }
  function papelLabel(p){ const x=PAPEIS.find(x=>x.id===p); return x?x.label:p; }

  /* ================= data loading ================= */
  function saveCache(){
    try{
      localStorage.setItem('cav_cache_user', JSON.stringify(currentUser));
      localStorage.setItem('cav_cache_data', JSON.stringify({TECNICOS, PROJETOS, allocations, USERS}));
    }catch(e){}
  }
  function loadCache(){
    try{
      const u = localStorage.getItem('cav_cache_user');
      const d = localStorage.getItem('cav_cache_data');
      if(!u || !d) return false;
      currentUser = JSON.parse(u);
      const parsed = JSON.parse(d);
      TECNICOS = parsed.TECNICOS||[]; PROJETOS = parsed.PROJETOS||[]; allocations = parsed.allocations||[]; USERS = parsed.USERS||[];
      return true;
    }catch(e){ return false; }
  }

  async function loadData(){
    const data = await api('/api/data');
    TECNICOS = data.tecnicos||[]; PROJETOS = data.projetos||[]; allocations = data.allocations||[];
    USERS = data.usuarios || [];
    saveCache();
  }

  async function boot(){
    try{
      const status = await api('/api/status');
      hasUsers = status.hasUsers;
    }catch(e){
      if(e.status===0 && TOKEN && loadCache()){
        offlineMode = true; hasUsers = true; loaded = true; render(); return;
      }
      hasUsers = true; // evita mostrar setup por engano; erro real aparece no login
      loginError = e.error || 'Erro ao conectar.';
    }
    if(!hasUsers){ loaded = true; render(); return; }
    if(TOKEN){
      try{
        const me = await api('/api/me');
        currentUser = me.user;
        await loadData();
        offlineMode = false;
      }catch(e){
        if(e.status===0 && loadCache()){
          offlineMode = true;
        } else {
          setToken(null); currentUser = null;
        }
      }
    }
    loaded = true; render();
  }

  /* ================= domain ================= */
  function techAllocs(tecnicoId){ return allocations.filter(a=>a.tecnicoId===tecnicoId); }
  function conflictSet(){
    const conflict = new Set(); const byTech = {};
    allocations.forEach(a=>{ (byTech[a.tecnicoId] = byTech[a.tecnicoId]||[]).push(a); });
    Object.values(byTech).forEach(list=>{
      for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
        if(allocConflicts(list[i], list[j])){
          conflict.add(list[i].id); conflict.add(list[j].id);
        }
      }
    });
    return conflict;
  }
  function techStatus(tecnicoId){
    const today = startOfDay(new Date());
    const list = techAllocs(tecnicoId);
    const active = list.find(a=> fromISO(a.inicio)<=today && today<=fromISO(a.fim));
    if(!active) return {label:"Disponível", cls:"status-livre"};
    if(active.tipo==="Indisponibilidade") return {label:active.obra||"Indisponível", cls:"status-indisp"};
    return {label:"Em campo · "+active.local, cls:"status-campo"};
  }
  function findOverlapsFor(draft, excludeId){
    return techAllocs(draft.tecnicoId).filter(a=> a.id!==excludeId && allocConflicts(draft, a));
  }
  // Acha coordenadas exatas (lat,lng) pra alocação: primeiro nos campos latitude/longitude
  // explícitos; senão tenta achar um par "(lat, lng)" já embutido no texto do endereço
  // (comum em endereços importados de outra ferramenta). Aceita tanto ponto quanto vírgula
  // como separador decimal (formato brasileiro comum: -23,926020). Retorna null se não achar nenhum.
  function parseCoordNum(s){
    if(s===undefined || s===null || s==='') return NaN;
    return parseFloat(String(s).trim().replace(',', '.'));
  }
  function coordsFor(a){
    if(a.latitude && a.longitude){
      const lat = parseCoordNum(a.latitude), lng = parseCoordNum(a.longitude);
      if(!isNaN(lat) && !isNaN(lng)) return lat+','+lng;
    }
    if(a.endereco){
      const m = a.endereco.match(/(-?\d{1,3}[.,]\d+)\s*,\s*(-?\d{1,3}[.,]\d+)/);
      if(m){
        const lat = parseCoordNum(m[1]), lng = parseCoordNum(m[2]);
        if(!isNaN(lat) && !isNaN(lng)) return lat+','+lng;
      }
    }
    return null;
  }
  function mapsUrl(a){
    const coords = coordsFor(a);
    if(coords) return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(coords);
    const query = (a.endereco && a.endereco.trim()) ? a.endereco.trim() : [a.obra, a.local].filter(Boolean).join(', ');
    if(!query) return null;
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
  }
  function wazeUrl(a){
    const coords = coordsFor(a);
    if(coords) return 'https://waze.com/ul?ll=' + encodeURIComponent(coords) + '&navigate=yes';
    const query = (a.endereco && a.endereco.trim()) ? a.endereco.trim() : [a.obra, a.local].filter(Boolean).join(', ');
    if(!query) return null;
    return 'https://waze.com/ul?q=' + encodeURIComponent(query) + '&navigate=yes';
  }
  function colleaguesOn(alloc){
    const obraKey = (alloc.obra||"").trim().toLowerCase();
    if(!obraKey || alloc.tipo==="Indisponibilidade") return [];
    return allocations.filter(a=>
      a.id!==alloc.id && a.tecnicoId!==alloc.tecnicoId &&
      (a.obra||"").trim().toLowerCase()===obraKey &&
      overlaps(fromISO(alloc.inicio),fromISO(alloc.fim),fromISO(a.inicio),fromISO(a.fim))
    ).map(a=>tecById(a.tecnicoId).nome);
  }
  function assignLanes(list){
    const sorted = [...list].sort((a,b)=> fromISO(a.inicio)-fromISO(b.inicio));
    const laneEnds = []; const laned = [];
    sorted.forEach(a=>{
      let lane = laneEnds.findIndex(end => fromISO(a.inicio) > end);
      if(lane===-1){ lane = laneEnds.length; laneEnds.push(fromISO(a.fim)); }
      else{ laneEnds[lane] = fromISO(a.fim); }
      laned.push({...a, lane});
    });
    return {items:laned, laneCount:Math.max(1,laneEnds.length)};
  }

  /* ================= dom helper ================= */
  function el(tag, attrs, ...children){
    const e = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k==='class') e.className = attrs[k];
      else if(k==='disabled'){ if(attrs[k]) e.setAttribute('disabled','disabled'); }
      else if(k==='checked'){ e.checked = !!attrs[k]; }
      else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    children.flat().forEach(c=>{
      if(c===null||c===undefined) return;
      e.appendChild(typeof c==='string'||typeof c==='number' ? document.createTextNode(c) : c);
    });
    return e;
  }
  function selectEl(value, options, onChange, labelFn){
    labelFn = labelFn || (o=>o);
    const s = el('select',{onchange:(e)=>onChange(e.target.value)});
    options.forEach(o=>{
      const v = (o && o.id!==undefined) ? o.id : o;
      s.appendChild(el('option',{value:v, ...((v===value)?{selected:'selected'}:{})}, labelFn(o)));
    });
    return s;
  }
  function root(){ return document.getElementById('app'); }

  /* ================= render dispatcher ================= */
  function render(){
    const app = root();
    // Preserve scroll position (da janela e dos painéis internos com rolagem própria)
    // pra recriar o conteúdo não jogar a tela pro topo — ex: ao clicar em "Editar".
    const scrollY = window.scrollY;
    const prevManageWrap = app.querySelector('.manage-wrap');
    const manageScrollTop = prevManageWrap ? prevManageWrap.scrollTop : 0;
    app.innerHTML = "";
    function restoreScroll(){
      const newManageWrap = app.querySelector('.manage-wrap');
      if(newManageWrap) newManageWrap.scrollTop = manageScrollTop;
      window.scrollTo(0, scrollY);
    }
    if(!loaded){ app.appendChild(el('div',{class:'empty'}, 'Carregando…')); restoreScroll(); return; }
    if(!hasUsers){ app.appendChild(renderSetup()); restoreScroll(); return; }
    if(!currentUser){ app.appendChild(renderLogin()); restoreScroll(); return; }
    if(currentUser.papel==='tecnico'){ app.appendChild(renderTecnicoView()); restoreScroll(); return; }
    app.appendChild(renderGestorView());
    restoreScroll();
  }

    card.appendChild(el('div',{class:'auth-field'}, el('label',{},'E-mail'),

    card.appendChild(el('div',{class:'auth-field'}, el('label',{},'Senha'),
      el('input',{type:'password', value:setupSenha, oninput:(e)=>setupSenha=e.target.value})));
    card.appendChild(el('div',{class:'auth-field'}, el('label',{},'Confirmar senha'),
      el('input',{type:'password', value:setupSenha2, oninput:(e)=>setupSenha2=e.target.value})));
    card.appendChild(el('button',{class:'btn wide', disabled:setupBusy, onclick: async ()=>{
      setupError="";

      if(setupSenha!==setupSenha2){ setupError="As senhas não coincidem."; render(); return; }
      setupBusy=true; render();
      try{
        const r = await api('/api/setup', {method:'POST', body:JSON.stringify({email:setupEmail.trim(), senha:setupSenha})});
        setToken(r.token); currentUser = r.user; hasUsers = true;
        await loadData();
        setupEmail=""; setupSenha=""; setupSenha2="";
      }catch(e){
        setupError = e.error || 'Erro ao criar conta.';
      }
      setupBusy=false; render();
    }}, setupBusy ? 'Criando…' : 'Criar conta e entrar'));
    card.appendChild(el('div',{class:'sub', style:'margin-top:16px; font-size:11px;'},
      'As senhas ficam guardadas com hash (bcrypt), não em texto puro. Ainda assim, é você quem administra este servidor — trate os acessos com cuidado.'
    ));
    wrap.appendChild(card);
    return wrap;

  /* ================= login ================= */
  function renderLogin(){
    const wrap = el('div',{class:'gate'});
    const card = el('div',{class:'gate-card'},
      el('p',{class:'eyebrow'}, 'OPERAÇÕES DE CAMPO'),
      el('h1',{}, 'Central de Alocação'),
      el('div',{class:'sub', style:'margin-bottom:16px;'}, 'Entre com o e-mail e senha cadastrados pelo administrador.')
    );
    if(loginError) card.appendChild(el('div',{class:'error-box'}, loginError));
    card.appendChild(el('div',{class:'auth-field'}, el('label',{},'E-mail'),
      el('input',{type:'email', value:loginEmail, oninput:(e)=>loginEmail=e.target.value})));
    card.appendChild(el('div',{class:'auth-field'}, el('label',{},'Senha'),
      el('input',{type:'password', value:loginSenha, oninput:(e)=>loginSenha=e.target.value,
        onkeydown:(e)=>{ if(e.key==='Enter') doLogin(); }})));
    card.appendChild(el('button',{class:'btn wide', disabled:loginBusy, onclick: doLogin}, loginBusy?'Entrando…':'Entrar'));
    card.appendChild(el('div',{class:'sub', style:'margin-top:16px; font-size:11px;'},
      'Esqueceu a senha? Peça para o administrador redefinir na aba Usuários.'
    ));
    wrap.appendChild(card);
    return wrap;

    async function doLogin(){
      loginError="";
      const email = loginEmail.trim();
      if(!email || !loginSenha){ loginError="Preencha e-mail e senha."; render(); return; }
      loginBusy=true; render();
      try{
        const r = await api('/api/login', {method:'POST', body:JSON.stringify({email, senha:loginSenha})});
        setToken(r.token); currentUser = r.user; loginSenha="";
        await loadData();
      }catch(e){
        loginError = e.error || 'Erro ao entrar.';
      }
      loginBusy=false; render();
    }
  }

  /* ================= TÉCNICO VIEW ================= */
  function renderTecnicoTimeline(meId){
    const {days: DAYS_IN_VIEW, dayWidth} = viewConfig();
    const step = navStepDays();
    const days = []; for(let i=0;i<DAYS_IN_VIEW;i++) days.push(addDays(windowStart,i));
    const totalWidth = dayWidth*DAYS_IN_VIEW;
    const today = startOfDay(new Date()); const conflicts = conflictSet();
    const wrap = el('div',{class:'timeline-wrap', style:'max-height:none; border-top:1px solid var(--border);'});
    wrap.appendChild(el('div',{class:'nav-row'},
      el('button',{class:'btn ghost small', onclick:()=>{ windowStart=addDays(windowStart,-step); render(); }}, '‹'),
      el('div',{class:'period'}, fmtShort(days[0])+' — '+fmtShort(days[days.length-1])),
      el('div',{style:'display:flex; gap:8px;'},
        el('button',{class:'btn ghost small', onclick:()=>{ windowStart=startOfDay(new Date()); render(); }}, 'Hoje'),
        el('button',{class:'btn ghost small', onclick:()=>{ windowStart=addDays(windowStart,step); render(); }}, '›'))
    ));
    const header = el('div',{class:'grid-header', style:`width:${totalWidth}px`});
    days.forEach(d=>{
      const isWeekend = d.getDay()===0 || d.getDay()===6, isToday = diffDays(d,today)===0;
      header.appendChild(el('div',{class:'day-col'+(isWeekend?' weekend':'')+(isToday?' today':''), style:`width:${dayWidth}px`},
        el('span',{class:'dow'}, DOW[d.getDay()]), el('span',{class:'num'}, d.getDate())));
    });
    wrap.appendChild(header);

    const rowsWrap = el('div',{class:'rows', style:`width:${totalWidth}px`});
    const list = techAllocs(meId).filter(a=> overlaps(fromISO(a.inicio),fromISO(a.fim), windowStart, addDays(windowStart,DAYS_IN_VIEW-1)));
    const {items, laneCount} = assignLanes(list);
    const rowHeight = Math.max(40, laneCount*30+10);
    const track = el('div',{class:'track', style:`height:${rowHeight}px`});
    const bg = el('div',{class:'track-bg'});
    days.forEach(d=>{
      const isWeekend = d.getDay()===0 || d.getDay()===6, isToday = diffDays(d,today)===0;
      bg.appendChild(el('div',{class:'bgcell'+(isWeekend?' weekend':'')+(isToday?' today':''), style:`width:${dayWidth}px`}));
    });
    track.appendChild(bg);
    const lanes = el('div',{class:'lanes', style:`height:${rowHeight}px`});
    items.forEach(a=>{
      const isConflict = conflicts.has(a.id);
      weekdaySegments(a.inicio, a.fim, windowStart, DAYS_IN_VIEW).forEach(([segS, segE])=>{
        const startIdx = diffDays(segS,windowStart), endIdx = diffDays(segE,windowStart);
        const left = startIdx*dayWidth, width = (endIdx-startIdx+1)*dayWidth - 4;
        const lbl = barLabel(a, width);
        lanes.appendChild(el('div',{class:'bar tipo-'+a.tipo+(isConflict?' conflito':'')+(a.emergencial?' emergencia':''),
          style:`left:${left+2}px; width:${width}px; top:${a.lane*30+6}px;`,
          title:lbl.full+(a.emergencial?' (emergência)':''),
          onclick:(ev)=>{ ev.stopPropagation(); modal={mode:'detail', data:a}; render(); }
        }, lbl.short, isConflict?el('span',{class:'conflict-flag'},'⚠'):null));
      });
    });
    track.appendChild(lanes);
    rowsWrap.appendChild(track);
    if(list.length===0) rowsWrap.appendChild(el('div',{class:'empty', style:'padding:16px;'}, 'Nada nesse período.'));
    wrap.appendChild(rowsWrap);
    return wrap;
  }

  function renderTecnicoView(){
    const me = tecById(currentUser.tecnicoId);
    const wrap = el('div',{});
    { const _ob = offlineBanner(); if(_ob) wrap.appendChild(_ob); }
    wrap.appendChild(el('div',{class:'topbar'},
      el('div',{},
        el('p',{class:'eyebrow'}, 'MINHA AGENDA'),
        el('h1',{}, me.nome),
        el('div',{class:'sub'}, (me.cargo||'')+' · '+(me.local||''))
      ),
      el('div',{class:'topbar-right'}, whoBadge(), trocarSenhaBtn(), logoutBtn())
    ));

    wrap.appendChild(renderTecnicoTimeline(me.id));

    const body = el('div',{class:'tech-view'});
    const today = startOfDay(new Date());
    const mine = techAllocs(me.id).slice().sort((a,b)=> fromISO(a.inicio)-fromISO(b.inicio));
    const atual = mine.filter(a=> fromISO(a.inicio)<=today && today<=fromISO(a.fim));
    const proximas = mine.filter(a=> fromISO(a.inicio)>today);
    const anteriores = mine.filter(a=> fromISO(a.fim)<today);

    if(mine.length>0){
      const myRows = mine.map(a=>({a, dias: overlapDaysInPeriod(a, fromISO(mine[0].inicio), fromISO(mine[mine.length-1].fim))}));
      body.appendChild(el('div',{style:'display:flex; gap:8px; margin-bottom:16px;'},
        el('button',{class:'btn ghost small', onclick:()=>exportCSV(myRows, fromISO(mine[0].inicio), fromISO(mine[mine.length-1].fim), 'minha-agenda')}, '⬇ CSV'),
        el('button',{class:'btn ghost small', onclick:()=>exportExcel(myRows, fromISO(mine[0].inicio), fromISO(mine[mine.length-1].fim), 'minha-agenda')}, '⬇ Excel')
      ));
    }

    function card(a){
      const colegas = colleaguesOn(a);
      const mapUrl = mapsUrl(a);
      const wUrl = wazeUrl(a);
      return el('div',{class:'card'},
        el('div',{class:'card-top'},
          el('div',{}, el('div',{class:'card-title'}, a.obra||a.tipo, a.emergencial?el('span',{class:'emerg-badge'},'🚨 Emergência'):null),
            el('div',{class:'card-sub'}, (a.local||'—')+' · '+fmtShort(fromISO(a.inicio))+' a '+fmtShort(fromISO(a.fim))+(a.horaInicio&&a.horaFim?(' · '+a.horaInicio+'–'+a.horaFim):''))),
          el('span',{class:'tipo-tag tag-'+a.tipo}, a.tipo)
        ),
        a.notas ? el('div',{class:'card-sub', style:'margin-top:6px;'}, a.notas) : null,
        colegas.length>0 ? el('div',{class:'colegas'}, el('b',{},'Com você: '), colegas.join(', ')) : null,
        mapUrl ? el('div',{style:'display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;'},
          el('a',{class:'btn ghost small', href:mapUrl, target:'_blank', rel:'noopener'}, '📍 Google Maps'),
          el('a',{class:'btn ghost small', href:wUrl, target:'_blank', rel:'noopener'}, '🚗 Waze')
        ) : null,
        el('div',{style:'display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;'},
          el('button',{class:'btn ghost small', onclick:()=>{ modal={mode:'detail', data:a}; render(); }}, (a.anexos&&a.anexos.length>0)?('📎 Ver anexos ('+a.anexos.length+')'):'📎 Anexar foto/PDF'),
          el('button',{class:'btn ghost small', onclick:()=>{ modal={mode:'detail', data:a}; render(); }}, (a.horasExtras&&a.horasExtras.length>0)?('⏱️ Horas extras ('+a.horasExtras.length+')'):'⏱️ Registrar hora extra'),
          el('button',{class:'btn ghost small', onclick:()=>{ modal={mode:'detail', data:a}; render(); }}, (a.despesas&&a.despesas.length>0)?('💰 Despesas ('+a.despesas.length+')'):'💰 Registrar despesa')
        )
      );
    }
    function section(title, list, emptyMsg){
      const s = el('div',{}); s.appendChild(el('div',{class:'section-title'}, title));
      if(list.length===0){ s.appendChild(el('div',{class:'sub'}, emptyMsg)); return s; }
      const c = el('div',{class:'cards'}); list.forEach(a=>c.appendChild(card(a))); s.appendChild(c); return s;
    }
    body.appendChild(section('Agora', atual, 'Nenhuma alocação em andamento hoje.'));
    body.appendChild(section('Próximas', proximas, 'Nada agendado à frente.'));
    if(anteriores.length>0) body.appendChild(section('Concluídas', anteriores.slice(-6).reverse(), ''));
    wrap.appendChild(body);
    if(modal) wrap.appendChild(renderModal());
    return wrap;
  }

  function tabsForPapel(papel){
    if(papel==='admin') return ['quadro','tecnicos','ferias','projetos','concluidos','relatorios','usuarios'];
    if(papel==='editor') return ['quadro','tecnicos','ferias','projetos','concluidos','relatorios'];
    if(papel==='planejador') return ['quadro','projetos','concluidos','relatorios'];
    if(papel==='supervisor') return ['quadro','tecnicos','ferias','projetos','concluidos','relatorios'];
    return ['quadro','tecnicos','projetos','concluidos','relatorios'];
  }

  function renderStats(){
    const conflicts = conflictSet();
    const emCampo = TECNICOS.filter(t=> techStatus(t.id).cls==='status-campo').length;
    const indisp = TECNICOS.filter(t=> techStatus(t.id).cls==='status-indisp').length;
    const livres = TECNICOS.length - emCampo - indisp;
    const nConflict = conflicts.size;
    const pill = (label, count, dotColor, active, onClick)=> el('div',{class:'pill'+(active?' active':''), onclick:onClick},
      el('span',{class:'dot', style:`background:${dotColor}`}), el('span',{}, label+' '), el('b',{}, count));
    return el('div',{class:'stats'},
      pill('Disponíveis', livres, 'var(--teal)', false, ()=>{}),
      pill('Em campo', emCampo, 'var(--blue)', false, ()=>{}),
      pill('Indisponíveis', indisp, 'var(--red)', false, ()=>{}),
      pill('Conflitos', nConflict, '#fff', onlyConflicts, ()=>{ onlyConflicts=!onlyConflicts; render(); })
    );
  }

  function filteredTechs(){
    const conflicts = conflictSet();
    return TECNICOS.filter(t=>{
      const text = (t.nome+' '+t.local).toLowerCase();
      if(filterText && !text.includes(filterText.toLowerCase())) return false;
      if(filterTipo!=='Todos'){ if(!techAllocs(t.id).some(a=>a.tipo===filterTipo)) return false; }
      if(onlyConflicts){ if(!techAllocs(t.id).some(a=>conflicts.has(a.id))) return false; }
      return true;
    });
  }

    const list = filteredTechs();
    const wrap = el('div',{class:'sidebar'}, el('div',{class:'sidebar-head'}, el('div',{class:'sub'}, list.length+' de '+TECNICOS.length+' técnicos')));
    list.forEach(t=>{

        el('span',{class:'status-badge '+st.cls}, st.label)));
    });

  }

  function renderTimeline(){
    const {days: DAYS_IN_VIEW, dayWidth} = viewConfig();
    const nameColWidth = isMobile() ? 96 : 160;
    const step = navStepDays();
    const days = []; for(let i=0;i<DAYS_IN_VIEW;i++) days.push(addDays(windowStart,i));
    const totalWidth = dayWidth*DAYS_IN_VIEW;
    const today = startOfDay(new Date()); const conflicts = conflictSet();
    const wrap = el('div',{class:'timeline-wrap'});
    wrap.appendChild(el('div',{class:"nav-row"},
      el('button',{class:'btn ghost small', onclick:()=>{ windowStart=addDays(windowStart,-step); render(); }}, '‹'),
      el('div',{class:'period'}, fmtShort(days[0])+' — '+fmtShort(days[days.length-1])),
      el('div',{style:'display:flex; gap:8px;'},
        el('button',{class:'btn ghost small', onclick:()=>{ windowStart=startOfDay(new Date()); render(); }}, 'Hoje'),
        el('button',{class:'btn ghost small', onclick:()=>{ windowStart=addDays(windowStart,step); render(); }}, '›'))
    ));
    const header = el('div',{class:'grid-header', style:`width:${nameColWidth+totalWidth}px`});
    header.appendChild(el('div',{class:'row-label-corner', style:`width:${nameColWidth}px`}));
    days.forEach(d=>{
      const isWeekend = d.getDay()===0 || d.getDay()===6, isToday = diffDays(d,today)===0;
      header.appendChild(el('div',{class:'day-col'+(isWeekend?' weekend':'')+(isToday?' today':''), style:`width:${dayWidth}px`},
        el('span',{class:'dow'}, DOW[d.getDay()]), el('span',{class:'num'}, d.getDate())));
    });
    wrap.appendChild(header);
    const rowsWrap = el('div',{class:'rows', style:`width:${nameColWidth+totalWidth}px`});
    filteredTechs().forEach(t=>{
      const list = techAllocs(t.id).filter(a=> overlaps(fromISO(a.inicio),fromISO(a.fim), windowStart, addDays(windowStart,DAYS_IN_VIEW-1)));
      const {items, laneCount} = assignLanes(list);
      const rowHeight = Math.max(36, laneCount*30+6);
      const track = el('div',{class:'track', style:`height:${rowHeight}px`});
      track.appendChild(el('div',{class:'row-label', style:`width:${nameColWidth}px; height:${rowHeight}px;`},
        el('span',{class:'n'}, t.nome), el('span',{class:'l'}, t.local)));
      const daysArea = el('div',{class:'days-area', style:`width:${totalWidth}px; height:${rowHeight}px;`});
      const bg = el('div',{class:'track-bg'});
      days.forEach(d=>{
        const isWeekend = d.getDay()===0 || d.getDay()===6, isToday = diffDays(d,today)===0;
        bg.appendChild(el('div',{class:'bgcell'+(isWeekend?' weekend':'')+(isToday?' today':''), style:`width:${dayWidth}px`}));
      });
      daysArea.appendChild(bg);
      const lanes = el('div',{class:'lanes', style:`height:${rowHeight}px`});
      items.forEach(a=>{
        const isConflict = conflicts.has(a.id);
        weekdaySegments(a.inicio, a.fim, windowStart, DAYS_IN_VIEW).forEach(([segS, segE])=>{
          const startIdx = diffDays(segS,windowStart), endIdx = diffDays(segE,windowStart);
          const left = startIdx*dayWidth, width = (endIdx-startIdx+1)*dayWidth - 4;
          const lbl = barLabel(a, width);
          lanes.appendChild(el('div',{class:'bar tipo-'+a.tipo+(isConflict?' conflito':'')+(a.emergencial?' emergencia':''),
            style:`left:${left+2}px; width:${width}px; top:${a.lane*30+4}px;`,
            title:lbl.full+(a.emergencial?' (emergência)':''),
            onclick:(ev)=>{ ev.stopPropagation(); modal={mode:'detail', data:a}; render(); }
          }, lbl.short, isConflict?el('span',{class:'conflict-flag'},'⚠'):null));
        });
      });
      daysArea.appendChild(lanes); track.appendChild(daysArea); rowsWrap.appendChild(track);
    });
    if(filteredTechs().length===0) rowsWrap.appendChild(el('div',{class:'empty'}, 'Nenhum técnico corresponde aos filtros atuais.'));
    wrap.appendChild(rowsWrap);
    return wrap;
  }

      label = 'Semana de '+fmtLong(pStart)+' a '+fmtLong(pEnd);
    } else {

      label = monthLabel(reportDate).replace(/^./, c=>c.toUpperCase());
    }

    wrap.appendChild(el('div',{style:'display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap;'},

      ),

      el('div',{class:'sub mono'}, label),
      el('button',{class:'btn ghost small', onclick:()=>{ reportDate = reportMode==='semana'? addDays(reportDate,7) : addMonths(reportDate,1); render(); }}, '›'),
      el('button',{class:'btn ghost small', onclick:()=>{ reportDate = startOfDay(new Date()); render(); }}, 'Hoje')
    ));

    const rows = allocations
      .filter(a=> overlaps(fromISO(a.inicio),fromISO(a.fim), pStart, pEnd))
      .map(a=> ({a, dias: overlapDaysInPeriod(a,pStart,pEnd)}))
      .sort((x,y)=> tecById(x.a.tecnicoId).nome.localeCompare(tecById(y.a.tecnicoId).nome));

    const porTipo = {};
    TIPOS.forEach(t=>porTipo[t]=0);
    rows.forEach(r=> porTipo[r.a.tipo] = (porTipo[r.a.tipo]||0) + r.dias);
    const tecnicosAtivos = new Set(rows.map(r=>r.a.tecnicoId)).size;

    // Total de horas extras registradas dentro do período do relatório (soma de todas as
    // alocações, não só das que aparecem na tabela, já que a hora extra é datada por dia).
    let totalHorasExtras = 0;
    let totalHotel = 0, totalRefeicao = 0;
    allocations.forEach(a=>{
      (a.horasExtras||[]).forEach(h=>{
        if(overlaps(fromISO(h.data), fromISO(h.data), pStart, pEnd)) totalHorasExtras += h.horas;
      });
      (a.despesas||[]).forEach(d=>{
        if(overlaps(fromISO(d.data), fromISO(d.data), pStart, pEnd)){
          if(d.tipo==='Hotel') totalHotel += d.valor;
          else if(d.tipo==='Refeição') totalRefeicao += d.valor;
        }
      });
    });
    const nEmergencias = rows.filter(r=>r.a.emergencial).length;

    wrap.appendChild(el('div',{class:'report-grid'},
      el('div',{class:'report-card'}, el('div',{class:'num'}, rows.length), el('div',{class:'lbl'}, 'Alocações no período')),

      el('div',{class:'report-card'}, el('div',{class:'num'}, porTipo['Manutenção']), el('div',{class:'lbl'}, 'Dias em manutenção')),
      el('div',{class:'report-card'}, el('div',{class:'num'}, porTipo['Indisponibilidade']), el('div',{class:'lbl'}, 'Dias indisponível')),
      el('div',{class:'report-card'}, el('div',{class:'num'}, totalHorasExtras.toFixed(1).replace(/\.0$/,'')), el('div',{class:'lbl'}, 'Horas extras no período')),
      el('div',{class:'report-card'}, el('div',{class:'num'}, nEmergencias), el('div',{class:'lbl'}, '🚨 Alocações de emergência')),
      el('div',{class:'report-card'}, el('div',{class:'num'}, 'R$ '+totalHotel.toFixed(2).replace('.',',')), el('div',{class:'lbl'}, '🏨 Hotel no período')),
      el('div',{class:'report-card'}, el('div',{class:'num'}, 'R$ '+totalRefeicao.toFixed(2).replace('.',',')), el('div',{class:'lbl'}, '🍽️ Refeição no período'))
    ));

    wrap.appendChild(el('div',{style:'display:flex; gap:8px; margin-bottom:12px;'},
      el('button',{class:'btn small', onclick:()=>exportCSV(rows,pStart,pEnd,reportMode)}, '⬇ Exportar CSV'),
      el('button',{class:'btn small ghost', onclick:()=>exportExcel(rows,pStart,pEnd,reportMode)}, '⬇ Exportar Excel')

    const table = el('table',{class:'report-table'},
      el('thead',{}, el('tr',{},

        el('th',{},'Início'), el('th',{},'Fim'), el('th',{},'Dias no período')
      )),

        el('td',{}, fmtShort(fromISO(r.a.fim))),
        el('td',{}, r.dias)
      )))
    );
    wrap.appendChild(el('div',{class:'table-wrap'}, table));
    if(rows.length===0) wrap.appendChild(el('div',{class:'empty'}, 'Nenhuma alocação neste período.'));
    return wrap;
  }

  function exportExcel(rows, pStart, pEnd, mode){
    if(typeof XLSX === 'undefined'){ alert('Biblioteca de Excel ainda carregando, tente novamente em instantes.'); return; }
    const data = rows.map(r=>({
      'Técnico': tecById(r.a.tecnicoId).nome,
      'Tipo': r.a.tipo,
      'Obra/Motivo': r.a.obra||'',
      'Local': r.a.local||'',
      'Início': r.a.inicio,
      'Fim': r.a.fim,
      'Dias no período': r.dias
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    ws['!cols'] = [{wch:28},{wch:16},{wch:26},{wch:20},{wch:12},{wch:12},{wch:14}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Relatório');
    XLSX.writeFile(wb, 'relatorio-'+mode+'-'+toISO(pStart)+'-a-'+toISO(pEnd)+'.xlsx');
  }

  function exportCSV(rows, pStart, pEnd, mode){
    const header = ["Técnico","Tipo","Obra/Motivo","Local","Início","Fim","Dias no período"];
    const csvRows = [header.join(';')];
    rows.forEach(r=>{
      const a = r.a;
      const line = [tecById(a.tecnicoId).nome, a.tipo, a.obra||'', a.local||'', a.inicio, a.fim, r.dias]
        .map(v=> '"'+String(v).replace(/"/g,'""')+'"').join(';');
      csvRows.push(line);
    });
    const csv = "\uFEFF" + csvRows.join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'relatorio-'+mode+'-'+toISO(pStart)+'-a-'+toISO(pEnd)+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function fileToBase64(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve(String(reader.result).split(',')[1]||'');
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

          el('img',{src:anexo.url, style:'width:80px; height:80px; object-fit:cover; border-radius:8px; border:1px solid var(--border);'})));
      } else {
        item.appendChild(el('a',{href:anexo.url, target:'_blank', rel:'noopener', class:'btn ghost small', style:'width:80px; justify-content:center;'}, '📄 PDF'));
      }
      item.appendChild(el('span',{style:'font-size:10px; color:var(--text-faint); text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:80px;'}, anexo.nome));
      if(canManageAnexos(a)){
        item.appendChild(el('button',{class:'btn ghost small', style:'padding:2px 6px; font-size:10px;', onclick: async ()=>{
          try{ await api('/api/allocations?id='+a.id, {method:'PATCH', body:JSON.stringify({action:'remove_anexo', url:anexo.url})}); await loadData(); modal={mode:'detail', data:allocations.find(x=>x.id===a.id)||a}; render(); }
          catch(e){ alert(e.error||'Erro ao remover anexo.'); }
        }}, 'Remover'));
      }
      list.appendChild(item);
    });
    wrap.appendChild(list);
    if(canManageAnexos(a)){
      let uploading = false;
      const input = el('input',{type:'file', accept:'image/*,application/pdf', style:'display:none;', onchange: async (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        if(file.size > 8*1024*1024){ alert('Arquivo muito grande (máx. 8MB).'); return; }
        try{
          const dataBase64 = await fileToBase64(file);
          await api('/api/allocations?id='+a.id, {method:'PATCH', body:JSON.stringify({action:'add_anexo', filename:file.name, mimeType:file.type, dataBase64})});
          await loadData(); modal={mode:'detail', data:allocations.find(x=>x.id===a.id)||a}; render();
        }catch(err){ alert(err.error||'Erro ao enviar anexo.'); }
      }});
      wrap.appendChild(input);
      wrap.appendChild(el('button',{class:'btn ghost small', onclick:()=> input.click()}, '+ Anexar foto ou PDF'));
    }
    return wrap;
  }

  /* ================= horas extras ================= */
  let novaHoraExtra = null; // {data, horas, notas} enquanto o form de uma alocação está aberto
  function renderHorasExtrasSection(a){
    const entries = a.horasExtras || [];
    const wrap = el('div',{style:'margin-top:14px; padding-top:12px; border-top:1px solid var(--border-soft);'});
    wrap.appendChild(el('div',{class:'section-title', style:'margin:0 0 8px 0;'}, '⏱️ Horas extras'));
    if(entries.length===0) wrap.appendChild(el('div',{class:'sub', style:'margin-bottom:8px;'}, 'Nenhuma hora extra registrada.'));
    entries.slice().sort((x,y)=> x.data<y.data?1:-1).forEach(h=>{
      const row = el('div',{style:'display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--border-soft); font-size:12px;'},
        el('div',{}, el('b',{}, fmtShort(fromISO(h.data))+' · '+String(h.horas).replace('.',',')+'h'), h.notas? el('div',{class:'sub', style:'margin-top:2px;'}, h.notas) : null)
      );
      if(canManageAnexos(a)){
        row.appendChild(el('button',{class:'btn ghost small', style:'padding:2px 6px; font-size:10px;', onclick: async ()=>{
          try{ await api('/api/allocations?id='+a.id, {method:'PATCH', body:JSON.stringify({action:'remove_hora_extra', id:h.id})}); await loadData(); modal={mode:'detail', data:allocations.find(x=>x.id===a.id)||a}; render(); }
          catch(e){ alert(e.error||'Erro ao remover.'); }
        }}, 'Remover'));
      }
      wrap.appendChild(row);
    });
    if(canManageAnexos(a)){
      if(!novaHoraExtra) novaHoraExtra = {data: a.inicio, horas:'', notas:''};
      const he = novaHoraExtra;
      wrap.appendChild(el('div',{style:'display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; align-items:flex-end;'},
        el('div',{class:'field', style:'margin-bottom:0; min-width:130px;'}, el('label',{},'Data'), el('input',{type:'date', value:he.data, min:a.inicio, max:a.fim, onchange:(e)=>he.data=e.target.value})),
        el('div',{class:'field', style:'margin-bottom:0; width:90px;'}, el('label',{},'Horas'), el('input',{type:'text', placeholder:'2,5', value:he.horas, oninput:(e)=>he.horas=e.target.value})),
        el('div',{class:'field', style:'margin-bottom:0; flex:1; min-width:140px;'}, el('label',{},'Motivo (opcional)'), el('input',{type:'text', value:he.notas, oninput:(e)=>he.notas=e.target.value})),
        el('button',{class:'btn small', onclick: async ()=>{
          try{
            await api('/api/allocations?id='+a.id, {method:'PATCH', body:JSON.stringify({action:'add_hora_extra', data:he.data, horas:he.horas, notas:he.notas})});
            novaHoraExtra = null;
            await loadData(); modal={mode:'detail', data:allocations.find(x=>x.id===a.id)||a}; render();
          }catch(e){ alert(e.error||'Erro ao registrar.'); }
        }}, '+ Registrar')
      ));
    }
    return wrap;
  }

  /* ================= despesas (hotel / refeição) ================= */
  let novaDespesa = null; // {tipo, data, valor, notas} enquanto o form de uma alocação está aberto
  function renderDespesasSection(a){
    const entries = a.despesas || [];
    const wrap = el('div',{style:'margin-top:14px; padding-top:12px; border-top:1px solid var(--border-soft);'});
    wrap.appendChild(el('div',{class:'section-title', style:'margin:0 0 8px 0;'}, '💰 Despesas (hotel / refeição)'));
    if(entries.length===0) wrap.appendChild(el('div',{class:'sub', style:'margin-bottom:8px;'}, 'Nenhuma despesa registrada.'));
    const icone = {Hotel:'🏨', 'Refeição':'🍽️', Outro:'💵'};
    let totalPeriodo = 0;
    entries.slice().sort((x,y)=> x.data<y.data?1:-1).forEach(h=>{
      totalPeriodo += h.valor;
      const row = el('div',{style:'display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--border-soft); font-size:12px;'},
        el('div',{}, el('b',{}, (icone[h.tipo]||'💵')+' '+h.tipo+' · '+fmtShort(fromISO(h.data))+' · R$ '+h.valor.toFixed(2).replace('.',',')), h.notas? el('div',{class:'sub', style:'margin-top:2px;'}, h.notas) : null)
      );
      if(canManageAnexos(a)){
        row.appendChild(el('button',{class:'btn ghost small', style:'padding:2px 6px; font-size:10px;', onclick: async ()=>{
          try{ await api('/api/allocations?id='+a.id, {method:'PATCH', body:JSON.stringify({action:'remove_despesa', id:h.id})}); await loadData(); modal={mode:'detail', data:allocations.find(x=>x.id===a.id)||a}; render(); }
          catch(e){ alert(e.error||'Erro ao remover.'); }
        }}, 'Remover'));
      }
      wrap.appendChild(row);
    });
    if(entries.length>0) wrap.appendChild(el('div',{class:'sub', style:'margin-top:6px; text-align:right; font-weight:600; color:var(--text);'}, 'Total: R$ '+totalPeriodo.toFixed(2).replace('.',',')));
    if(canManageAnexos(a)){
      if(!novaDespesa) novaDespesa = {tipo:'Hotel', data: a.inicio, valor:'', notas:''};
      const de = novaDespesa;
      wrap.appendChild(el('div',{style:'display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; align-items:flex-end;'},
        el('div',{class:'field', style:'margin-bottom:0; min-width:110px;'}, el('label',{},'Tipo'), selectEl(de.tipo, ['Hotel','Refeição','Outro'], v=>de.tipo=v)),
        el('div',{class:'field', style:'margin-bottom:0; min-width:130px;'}, el('label',{},'Data'), el('input',{type:'date', value:de.data, min:a.inicio, max:a.fim, onchange:(e)=>de.data=e.target.value})),
        el('div',{class:'field', style:'margin-bottom:0; width:100px;'}, el('label',{},'Valor (R$)'), el('input',{type:'text', placeholder:'150,00', value:de.valor, oninput:(e)=>de.valor=e.target.value})),
        el('div',{class:'field', style:'margin-bottom:0; flex:1; min-width:140px;'}, el('label',{},'Observação (opcional)'), el('input',{type:'text', value:de.notas, oninput:(e)=>de.notas=e.target.value})),
        el('button',{class:'btn small', onclick: async ()=>{
          try{
            await api('/api/allocations?id='+a.id, {method:'PATCH', body:JSON.stringify({action:'add_despesa', tipo:de.tipo, data:de.data, valor:de.valor, notas:de.notas})});
            novaDespesa = null;
            await loadData(); modal={mode:'detail', data:allocations.find(x=>x.id===a.id)||a}; render();
          }catch(e){ alert(e.error||'Erro ao registrar.'); }
        }}, '+ Registrar')
      ));
    }
    return wrap;
  }

  function renderModal(){
    const overlay = el('div',{class:'overlay', onclick:(e)=>{ if(e.target===e.currentTarget){ modal=null; novaHoraExtra=null; novaDespesa=null; render(); } }});
    if(modal.mode==='minha-senha'){
      const d = modal.data;
      const box = el('div',{class:'modal'},
        el('h2',{}, 'Trocar minha senha'), el('div',{class:'sub'}, 'Use pelo menos 6 caracteres.'),
        d.erro ? el('div',{class:'error-box'}, d.erro) : null,
        el('div',{class:'field'}, el('label',{},'Nova senha'), el('input',{type:'password', oninput:(e)=>d.senha1=e.target.value})),
        el('div',{class:'field'}, el('label',{},'Confirmar nova senha'), el('input',{type:'password', oninput:(e)=>d.senha2=e.target.value})),
        el('div',{class:'modal-actions'},
          el('button',{class:'btn ghost', onclick:()=>{ modal=null; render(); }}, 'Cancelar'),
          el('button',{class:'btn', onclick: async ()=>{
            d.erro = '';
            if(!d.senha1 || d.senha1.length<6){ d.erro='Use pelo menos 6 caracteres.'; render(); return; }
            if(d.senha1!==d.senha2){ d.erro='As senhas não coincidem.'; render(); return; }
            try{ await api('/api/usuarios?id='+currentUser.id, {method:'PATCH', body:JSON.stringify({senha:d.senha1})}); modal=null; render(); }
            catch(e){ d.erro = e.error||'Erro ao trocar senha.'; render(); }
          }}, 'Salvar')
        )
      );
      overlay.appendChild(box); return overlay;
    }
    if(modal.mode==='detail'){
      const a = modal.data; const isConflict = conflictSet().has(a.id); const tec = tecById(a.tecnicoId);
      const colegas = colleaguesOn(a);
      const mapUrl = mapsUrl(a);
      const wUrl = wazeUrl(a);
      const box = el('div',{class:'modal'},
        el('h2',{}, a.obra || a.tipo, a.emergencial?el('span',{class:'emerg-badge'},'🚨 Emergência'):null), el('div',{class:'sub'}, a.tipo),
        isConflict ? el('div',{class:'warn-box'}, '⚠ Este período se sobrepõe a outra alocação deste técnico.') : null,
        el('div',{class:'detail-list'},
          el('div',{}, el('b',{},'Técnico: '), tec.nome),
          el('div',{}, el('b',{},'Local: '), a.local||'—'),
          el('div',{}, el('b',{},'Período: '), fmtShort(fromISO(a.inicio))+' a '+fmtShort(fromISO(a.fim))+(a.horaInicio&&a.horaFim?(' · '+a.horaInicio+'–'+a.horaFim):'')),
          a.notas ? el('div',{}, el('b',{},'Notas: '), a.notas) : null,
          colegas.length>0 ? el('div',{}, el('b',{},'Colegas na mesma obra: '), colegas.join(', ')) : null
        ),
        mapUrl ? el('div',{style:'display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;'},
          el('a',{class:'btn ghost small', href:mapUrl, target:'_blank', rel:'noopener'}, '📍 Google Maps'),
          el('a',{class:'btn ghost small', href:wUrl, target:'_blank', rel:'noopener'}, '🚗 Waze')
        ) : null,
        renderAnexosSection(a),
        renderHorasExtrasSection(a),
        renderDespesasSection(a),
        el('div',{class:'modal-actions'},
          el('button',{class:'btn ghost', onclick:()=>{ modal=null; novaHoraExtra=null; novaDespesa=null; render(); }}, 'Fechar'),
          canAllocate(currentUser.papel) ? el('button',{class:'btn danger', onclick: async ()=>{
            try{ await api('/api/allocations?id='+a.id, {method:'DELETE'}); await loadData(); modal=null; render(); }
            catch(e){ alert(e.error||'Erro ao excluir.'); }
          }}, 'Excluir alocação') : null
        )
      );
      overlay.appendChild(box); return overlay;
    }
    const d = modal.data;
    const conflictsFound = d.tecnicoId ? findOverlapsFor(d, null) : [];
    const projSel = d.projetoId ? projById(d.projetoId) : null;
    const outOfWindow = !!(projSel && projSel.inicio && projSel.fim && d.inicio && d.fim &&
      (fromISO(d.inicio) < fromISO(projSel.inicio) || fromISO(d.fim) > fromISO(projSel.fim)));
    const podeEmergencia = d.inicio === d.fim && conflictsFound.length > 0;
    const box = el('div',{class:'modal'},
      el('h2',{}, 'Nova alocação'), el('div',{class:'sub'}, 'Aloque um técnico a uma obra, manutenção ou indisponibilidade.'),
      conflictsFound.length>0 ? el('div',{class:'warn-box'}, '⚠ Conflito: '+tecById(d.tecnicoId).nome+' já está em "'+conflictsFound[0].obra+'" de '+fmtShort(fromISO(conflictsFound[0].inicio))+' a '+fmtShort(fromISO(conflictsFound[0].fim))+'. '+(podeEmergencia? 'Marque como emergência abaixo para realocar o técnico sem perder o outro compromisso.' : 'Ainda dá para salvar, mas o conflito fica marcado no quadro.')) : null,
      outOfWindow ? el('div',{class:'warn-box'}, '⚠ Fora do período planejado do projeto ('+fmtShort(fromISO(projSel.inicio))+' a '+fmtShort(fromISO(projSel.fim))+'). Ainda dá para salvar.') : null,
      el('div',{class:'field'}, el('label',{},'Técnico'),
        TECNICOS.length ? selectEl(d.tecnicoId, TECNICOS, v=>{ d.tecnicoId=v; d.colegas=(d.colegas||[]).filter(id=>id!==v); render(); }, t=>t.nome)
          : el('div',{class:'sub'}, 'Cadastre um técnico primeiro na aba "Técnicos".')),
      (TECNICOS.filter(t=>t.id!==d.tecnicoId).length>0) ? el('div',{class:'field'}, el('label',{},'Colegas nessa mesma alocação (opcional)'),
        el('div',{class:'sub', style:'margin-top:-3px; margin-bottom:6px;'}, 'Marque quem mais vai junto — cria a mesma alocação para todos de uma vez.'),
        el('div',{style:'display:flex; flex-direction:column; gap:6px; max-height:140px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; padding:8px;'},
          TECNICOS.filter(t=>t.id!==d.tecnicoId).map(t=>
            el('div',{class:'checkbox-field', style:'margin-bottom:0;'},
              el('input',{type:'checkbox', id:'colega-'+t.id, checked:(d.colegas||[]).includes(t.id), onchange:(e)=>{
                d.colegas = d.colegas || [];
                if(e.target.checked){ if(!d.colegas.includes(t.id)) d.colegas.push(t.id); }
                else{ d.colegas = d.colegas.filter(id=>id!==t.id); }
              }}),
              el('label',{for:'colega-'+t.id}, t.nome)
            )
          )
        )
      ) : null,
      PROJETOS.length ? el('div',{class:'field'}, el('label',{},'Projeto cadastrado (opcional)'),
        selectEl('', [{id:'',nome:'— selecionar —'}, ...PROJETOS], v=>{
          if(!v) return; const p = projById(v); if(p){ d.obra=p.nome; d.local=p.local; d.endereco=p.endereco||''; d.latitude=p.latitude||''; d.longitude=p.longitude||''; d.projetoId=p.id; if(p.inicio) d.inicio=p.inicio; if(p.fim) d.fim=p.fim; if(p.horaInicio) d.horaInicio=p.horaInicio; if(p.horaFim) d.horaFim=p.horaFim; if(p.descricao && !d.notas) d.notas=p.descricao; render(); }
        }, o=>o.local ? (o.nome+' — '+o.local) : o.nome)) : null,
      el('div',{class:'field'}, el('label',{},'Tipo'), selectEl(d.tipo, TIPOS, v=>{ d.tipo=v; render(); })),
      el('div',{class:'field'}, el('label',{},'Obra / Cliente / Motivo'),
        el('input',{type:'text', value:d.obra, placeholder:'Ex: Gerdau Cosigua, Férias…', oninput:(e)=>d.obra=e.target.value})),
      el('div',{class:'field'}, el('label',{},'Local'),
        el('input',{type:'text', value:d.local, placeholder:'Ex: São Paulo', oninput:(e)=>d.local=e.target.value})),
      el('div',{class:'field'}, el('label',{},'Endereço completo (opcional, para o mapa)'),
        el('input',{type:'text', value:d.endereco||'', placeholder:'Rua, número, cidade', oninput:(e)=>d.endereco=e.target.value})),
      el('div',{class:'row2'},
        el('div',{class:'field'}, el('label',{},'Início'), el('input',{type:'date', value:d.inicio, onchange:(e)=>{ d.inicio=e.target.value; render(); }})),
        el('div',{class:'field'}, el('label',{},'Fim'), el('input',{type:'date', value:d.fim, onchange:(e)=>{ d.fim=e.target.value; render(); }}))
      ),
      el('div',{class:'row2'},
        el('div',{class:'field'}, el('label',{},'Horário início (opcional)'), el('input',{type:'time', value:d.horaInicio||'', onchange:(e)=>{ d.horaInicio=e.target.value; render(); }})),
        el('div',{class:'field'}, el('label',{},'Horário fim (opcional)'), el('input',{type:'time', value:d.horaFim||'', onchange:(e)=>{ d.horaFim=e.target.value; render(); }}))
      ),
      el('div',{class:'field'}, el('label',{},'Notas (opcional)'), el('textarea',{oninput:(e)=>d.notas=e.target.value}, d.notas)),
      podeEmergencia ? el('div',{class:'emerg-box'},
        el('div',{class:'checkbox-field'},
          el('input',{type:'checkbox', id:'emerg-chk', checked:!!d.emergencial, onchange:(e)=>{ d.emergencial=e.target.checked; render(); }}),
          el('label',{for:'emerg-chk'}, '🚨 Isso é uma emergência (desvio temporário do técnico)')
        ),
        d.emergencial ? el('div',{},
          el('div',{class:'field'}, el('label',{},'A emergência é:'),
            selectEl(d.emergencialModo||'dia', [{id:'dia',nome:'Dia inteiro (o técnico volta ao outro projeto no dia seguinte)'},{id:'horario',nome:'Só um horário específico (ele continua no outro projeto no restante do dia)'}], v=>{ d.emergencialModo=v; render(); }, o=>o.nome)),
          d.emergencialModo==='horario' ? el('div',{class:'sub', style:'margin-top:-4px;'}, 'Use os campos "Horário início/fim" acima para definir o horário da emergência.') : null
        ) : null
      ) : null,
      el('div',{class:'modal-actions'},
        el('button',{class:'btn ghost', onclick:()=>{ modal=null; render(); }}, 'Cancelar'),
        el('button',{class:'btn', disabled: !d.tecnicoId || !d.obra || d.fim<d.inicio || (d.emergencial && d.emergencialModo==='horario' && (!d.horaInicio || !d.horaFim)), onclick: async ()=>{
          try{
            await api('/api/allocations', {method:'POST', body:JSON.stringify(d)});
            // Cria a mesma alocação (sem o sinalizador de emergência) para cada colega marcado,
            // pra não ter que repetir o preenchimento técnico por técnico.
            for(const colegaId of (d.colegas||[])){
              const extra = {...d, tecnicoId: colegaId, emergencial:false};
              delete extra.colegas;
              await api('/api/allocations', {method:'POST', body:JSON.stringify(extra)});
            }
            await loadData(); modal=null; render();
          }catch(e){ alert(e.error||'Erro ao salvar.'); }
        }}, (d.colegas&&d.colegas.length>0) ? ('Salvar aloc. para '+(1+d.colegas.length)+' técnicos') : 'Salvar alocação')
      )
    );
    overlay.appendChild(box); return overlay;
  }

  let resizeTimer = null;
  let lastWidth = window.innerWidth;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
      const w = window.innerWidth;
      if(Math.abs(w - lastWidth) > 10){ lastWidth = w; if(loaded) render(); }
    }, 200);
  });

  boot();
})();

</script>
</body></html>
